<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librería — Catálogo, clientes y ventas</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/vistas.css">
</head>
<body>
  <header>
    <p class="marca"><strong>Librería</strong></p>
  </header>
  <nav aria-label="Vistas principales">
    <ul>
      <li><a href="#/catalogo">Catálogo</a></li>
      <li><a href="#/libros">Libros</a></li>
      <li><a href="#/clientes">Clientes</a></li>
      <li><a href="#/ventas">Ventas</a></li>
      <li><a href="#/historial">Historial</a></li>
    </ul>
  </nav>
  <main tabindex="-1">
    <section id="vista-catalogo" hidden>
      <h1 tabindex="-1">Catálogo</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-libros" hidden>
      <h1 tabindex="-1">Libros</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-clientes" hidden>
      <h1 tabindex="-1">Clientes</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-ventas" hidden>
      <h1 tabindex="-1">Ventas</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
    <section id="vista-historial" hidden>
      <h1 tabindex="-1">Historial</h1>
      <div class="region-mensajes" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vistas/catalogo.js"></script>
  <script src="js/vistas/libros.js"></script>
  <script src="js/vistas/clientes.js"></script>
  <script src="js/vistas/ventas.js"></script>
  <script src="js/vistas/historial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
